name: Native builds
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Stamp Cargo version with commit
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          path = Path("Cargo.toml")
          source = path.read_text()
          sha = os.environ["GITHUB_SHA"][:7]
          pattern = r'(?m)^(version\s*=\s*")([0-9]+\.[0-9]+\.[0-9]+)(?:\+[0-9a-f]+)?(")      - run: cargo test --no-default-features
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: z3-launcher-windows
          path: |
            target/release/z3-launcher.exe
            locales/
            WINDOWS.md
            LICENSE
            LICENSE-MIT-original
            LICENSING.md
            assets/DejaVu-LICENSE.txt
  linux:
    if: ${{ false }} # Temporarily disabled; keep native Linux build configuration.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: cargo test
      - run: cargo build --release
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config cmake curl file python3 libsdl2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev
      - run: cargo test
      - run: |
          chmod +x packaging/AppRun
          bash ./build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: z3-launcher-appimage-x86_64
          path: dist/*.AppImage*

          updated, count = re.subn(pattern, lambda m: m[1] + m[2] + "+" + sha + m[3], source, count=1)
          if count != 1:
              raise SystemExit("Cannot find Cargo package version")
          path.write_text(updated)
          print(f"Cargo package version: {re.search(pattern, updated).group(0)}")
          PY
      - run: cargo test --no-default-features
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: z3-launcher-windows
          path: |
            target/release/z3-launcher.exe
            locales/
            WINDOWS.md
            LICENSE
            LICENSE-MIT-original
            LICENSING.md
            assets/DejaVu-LICENSE.txt
