name: Native builds
# Feature branches are validated through their pull requests.
# Push builds remain available on main, with manual runs as needed.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Stamp Cargo version with commit
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path("Cargo.toml")
          lines = p.read_text().splitlines(keepends=True)
          for i, line in enumerate(lines):
              if line.startswith("version = "):
                  base = line.split('"')[1].split("+")[0]
                  lines[i] = 'version = "' + base + '+' + os.environ["GITHUB_SHA"][:7] + '"\n'
                  break
          else:
              raise SystemExit("Cargo version not found")
          p.write_text("".join(lines))
          print(lines[i].strip())
          PY
      - run: cargo test --no-default-features
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: z3-launcher-windows
          path: |
            target/release/z3-launcher.exe
            locales/
            WINDOWS.md
            LICENSE
            LICENSE-MIT-original
            LICENSING.md
            assets/DejaVu-LICENSE.txt
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Stamp Cargo version with commit
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path("Cargo.toml")
          lines = p.read_text().splitlines(keepends=True)
          for i, line in enumerate(lines):
              if line.startswith("version = "):
                  base = line.split('"')[1].split("+")[0]
                  lines[i] = 'version = "' + base + '+' + os.environ["GITHUB_SHA"][:7] + '"\n'
                  break
          else:
              raise SystemExit("Cargo version not found")
          p.write_text("".join(lines))
          print(lines[i].strip())
          PY
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: cargo test
      - run: cargo build --release
      - name: Package native Linux build
        run: |
          mkdir -p dist
          tar -czf dist/Z3-Launcher-1.0.0-linux-x86_64.tar.gz \
            -C target/release z3-launcher -C "$GITHUB_WORKSPACE" \
            locales LICENSE LICENSE-MIT-original LICENSING.md assets/DejaVu-LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: z3-launcher-linux-x86_64
          path: dist/*.tar.gz
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Stamp Cargo version with commit
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path("Cargo.toml")
          lines = p.read_text().splitlines(keepends=True)
          for i, line in enumerate(lines):
              if line.startswith("version = "):
                  base = line.split('"')[1].split("+")[0]
                  lines[i] = 'version = "' + base + '+' + os.environ["GITHUB_SHA"][:7] + '"\n'
                  break
          else:
              raise SystemExit("Cargo version not found")
          p.write_text("".join(lines))
          print(lines[i].strip())
          PY
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config cmake curl file python3 libsdl2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev
      - run: cargo test
      - run: |
          chmod +x packaging/AppRun
          bash ./build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: z3-launcher-appimage-x86_64
          path: dist/*.AppImage*

  flatpak:
    uses: ./.github/workflows/flatpak.yml
  release:
    needs: [windows, linux, appimage, flatpak]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Publish version 1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [ "$version" != "1.0.0" ]; then
            echo "Release publication only applies to version 1.0.0."
            exit 0
          fi
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "Release v1.0.0 already exists; leaving it unchanged."
            exit 0
          fi
          mkdir -p release-assets
          cp release-artifacts/z3-launcher-linux-x86_64/*.tar.gz release-assets/
          cp release-artifacts/z3-launcher-appimage-x86_64/*.AppImage* release-assets/
          cp release-artifacts/z3-launcher-flatpak-x86_64-experimental/*.flatpak release-assets/
          (
            cd release-artifacts/z3-launcher-windows
            zip -r ../../release-assets/Z3-Launcher-1.0.0-windows-x86_64.zip .
          )
          gh release create v1.0.0 release-assets/* \
            --target "$GITHUB_SHA" --title "Z3-Launcher 1.0.0" \
            --notes-file RELEASE_NOTES_1.0.md
