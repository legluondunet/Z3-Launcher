name: Native builds
# Feature branches are validated through their pull requests.
# Push builds remain available on main, with manual runs as needed.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: xander-haj/Z3R
          ref: dd44234a6baaaafa1bdee0a71e1006fc8877ab20 # v0.2.4, pinned asset tool sources
          path: z3r-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Stamp Cargo version with commit
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path("Cargo.toml")
          lines = p.read_text().splitlines(keepends=True)
          for i, line in enumerate(lines):
              if line.startswith("version = "):
                  base = line.split('"')[1].split("+")[0]
                  lines[i] = 'version = "' + base + '+' + os.environ["GITHUB_SHA"][:7] + '"\n'
                  break
          else:
              raise SystemExit("Cargo version not found")
          p.write_text("".join(lines))
          print(lines[i].strip())
          PY
      - run: cargo test --no-default-features
      - run: cargo build --release
      - name: Build standalone Z3R resource extractor
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.16.0 Pillow==11.3.0 PyYAML==6.0.2
          python -m PyInstaller --noconfirm --onedir --distpath tools-dist --name z3r-extractor --add-data "z3r-upstream/assets;assets" --add-data "z3r-upstream/other/3x5_font.png;other" --paths z3r-upstream/assets --hidden-import compile_resources --hidden-import extract_resources --hidden-import PIL.Image --hidden-import yaml tools/extract-z3r.py
          tools-dist/z3r-extractor/z3r-extractor.exe --help
      - name: Stage standalone Windows launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows/extractor,dist/windows/assets | Out-Null
          Copy-Item target/release/z3-launcher.exe dist/windows/
          Copy-Item -Recurse locales dist/windows/
          Copy-Item WINDOWS.md,LICENSE,LICENSE-MIT-original,LICENSING.md dist/windows/
          Copy-Item assets/DejaVu-LICENSE.txt dist/windows/assets/
          Copy-Item -Recurse tools-dist/z3r-extractor/* dist/windows/extractor/
          Copy-Item z3r-upstream/LICENSE.txt dist/windows/extractor/Z3R-LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: z3-launcher-windows
          path: dist/windows/
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: xander-haj/Z3R
          ref: dd44234a6baaaafa1bdee0a71e1006fc8877ab20 # v0.2.4, pinned asset tool sources
          path: z3r-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Stamp Cargo version with commit
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path("Cargo.toml")
          lines = p.read_text().splitlines(keepends=True)
          for i, line in enumerate(lines):
              if line.startswith("version = "):
                  base = line.split('"')[1].split("+")[0]
                  lines[i] = 'version = "' + base + '+' + os.environ["GITHUB_SHA"][:7] + '"\n'
                  break
          else:
              raise SystemExit("Cargo version not found")
          p.write_text("".join(lines))
          print(lines[i].strip())
          PY
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: cargo test
      - run: cargo build --release
      - name: Build standalone Z3R resource extractor
        run: |
          python -m pip install pyinstaller==6.16.0 Pillow==11.3.0 PyYAML==6.0.2
          python -m PyInstaller --noconfirm --onedir --distpath tools-dist --name z3r-extractor --add-data "z3r-upstream/assets:assets" --add-data "z3r-upstream/other/3x5_font.png:other" --paths z3r-upstream/assets --hidden-import compile_resources --hidden-import extract_resources --hidden-import PIL.Image --hidden-import yaml tools/extract-z3r.py
          tools-dist/z3r-extractor/z3r-extractor --help
      - name: Package native Linux build
        run: |
          mkdir -p dist/native/extractor dist/native/assets
          cp target/release/z3-launcher dist/native/
          cp -a tools-dist/z3r-extractor/. dist/native/extractor/
          cp z3r-upstream/LICENSE.txt dist/native/extractor/Z3R-LICENSE.txt
          cp -r locales dist/native/
          cp LICENSE LICENSE-MIT-original LICENSING.md dist/native/
          cp assets/DejaVu-LICENSE.txt dist/native/assets/
          tar -czf dist/Z3-Launcher-1.2.0-linux-x86_64.tar.gz -C dist/native .
      - uses: actions/upload-artifact@v4
        with:
          name: z3-launcher-linux-x86_64
          path: dist/*.tar.gz
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: xander-haj/Z3R
          ref: dd44234a6baaaafa1bdee0a71e1006fc8877ab20 # v0.2.4, pinned asset tool sources
          path: z3r-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Stamp Cargo version with commit
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path("Cargo.toml")
          lines = p.read_text().splitlines(keepends=True)
          for i, line in enumerate(lines):
              if line.startswith("version = "):
                  base = line.split('"')[1].split("+")[0]
                  lines[i] = 'version = "' + base + '+' + os.environ["GITHUB_SHA"][:7] + '"\n'
                  break
          else:
              raise SystemExit("Cargo version not found")
          p.write_text("".join(lines))
          print(lines[i].strip())
          PY
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config cmake curl file python3 libsdl2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev
      - run: cargo test
      - name: Build standalone Z3R resource extractor
        run: |
          python -m pip install pyinstaller==6.16.0 Pillow==11.3.0 PyYAML==6.0.2
          python -m PyInstaller --noconfirm --onedir --distpath tools-dist --name z3r-extractor --add-data "z3r-upstream/assets:assets" --add-data "z3r-upstream/other/3x5_font.png:other" --paths z3r-upstream/assets --hidden-import compile_resources --hidden-import extract_resources --hidden-import PIL.Image --hidden-import yaml tools/extract-z3r.py
          tools-dist/z3r-extractor/z3r-extractor --help
      - run: |
          chmod +x packaging/AppRun
          bash ./build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: z3-launcher-appimage-x86_64
          path: dist/*.AppImage*

  flatpak:
    uses: ./.github/workflows/flatpak.yml
  release:
    needs: [windows, linux, appimage, flatpak]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Publish version 1.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [ "$version" != "1.2.0" ]; then
            echo "Release publication only applies to version 1.2.0."
            exit 0
          fi
          if gh release view v1.2.0 >/dev/null 2>&1; then
            echo "Release v1.2.0 already exists; leaving it unchanged."
            exit 0
          fi
          mkdir -p release-assets
          cp release-artifacts/z3-launcher-linux-x86_64/*.tar.gz release-assets/
          cp release-artifacts/z3-launcher-appimage-x86_64/*.AppImage* release-assets/
          cp release-artifacts/z3-launcher-flatpak-x86_64-experimental/*.flatpak release-assets/
          (
            cd release-artifacts/z3-launcher-windows
            zip -r ../../release-assets/Z3-Launcher-1.2.0-windows-x86_64.zip .
          )
          gh release create v1.2.0 release-assets/* \
            --target "$GITHUB_SHA" --title "Z3-Launcher 1.2.0" \
            --notes-file RELEASE_NOTES_1.2.md
