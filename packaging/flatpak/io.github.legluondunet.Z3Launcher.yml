app-id: io.github.legluondunet.Z3Launcher
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: z3-launcher
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --device=all
  - --filesystem=home
  - --talk-name=org.freedesktop.portal.Desktop
modules:
  - name: z3-launcher
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - cargo build --release --locked
      - install -Dm755 target/release/z3-launcher /app/bin/z3-launcher
      - install -Dm644 packaging/z3-launcher.svg /app/share/icons/hicolor/scalable/apps/io.github.legluondunet.Z3Launcher.svg
      - install -Dm644 packaging/flatpak/io.github.legluondunet.Z3Launcher.desktop /app/share/applications/io.github.legluondunet.Z3Launcher.desktop
      - install -Dm644 LICENSE /app/share/doc/z3-launcher/LICENSE
      - install -Dm644 LICENSING.md /app/share/doc/z3-launcher/LICENSING.md
      - mkdir -p /app/bin/locales
      - cp locales/*.json /app/bin/locales/
    sources:
      - type: dir
        path: ../..
